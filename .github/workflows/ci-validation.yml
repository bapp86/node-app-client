name: CI Validation (Push)

on:
  push:
    branches:
      - 'feature/*' # Solo ramas de trabajo
    tags-ignore:
      - '**' # Requisito: que no se dispare por tags

jobs:
  validate-code:
    # Llamamos a la lógica centralizada
    uses: bapp86/central-templates/.github/workflows/reusable-pipeline.yml@main
    with:
      should_push: false # Requisito I1: Construir sin publicar
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
