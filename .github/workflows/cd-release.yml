name: CD Release (Tag)

on:
  push:
    tags:
      - 'v*' # Se activa al crear tags que comienzan con v

jobs:
  release-image:
    # Llamamos a la misma lógica centralizada
    uses: bapp86/central-templates/.github/workflows/reusable-pipeline.yml@main
    with:
      should_push: true # Este sí publica la imagen
      image_tag: ${{ github.ref_name }} # Usa el nombre del tag como versión
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}${{ secrets.DOCKER_HUB_TOKEN }}
